<textarea id="api" >put your google api here</textarea>
<textarea id="task" readonly></textarea>

<select name="Ai" id="aiBox">
  <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (fastest and with least token usage)</option>
  <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro preview (best model but will eat through your tokens)</option>
  <option value="gemini-3.7-flash" selected>gemini-3.7-flash (mid range model slightly dumber but still useful)</option>

<script type="module">
import { GoogleGenAI } from "@google/genai";

var usingAi = document.getElementById('aiBox');
var aiModel = usingAi.value;


var apiKey
var ai

async function run() {

//gets the value of
usingAi = document.getElementById('aiBox');
aiModel = usingAi.value;


apiKey = document.getElementById('api');
ai = new GoogleGenAI({ apiKey: apiKey.value });


const inputField = document.getElementById('message');
const outputField = document.getElementById('answer');
const bar = document.getElementById('task');

var original=inputField.value

const userPrompt = inputField.value+" split this request into several achievable goals and return an answer like (make 3d graphics, add logic, make it look nice) ONLY use commas for separation";

var response = await ai.models.generateContent({
model: aiModel,
contents: userPrompt,
});

console.log(response.text)

const fullTask=response.text
.split(',')
console.log(fullTask)
bar.value ="0/"+fullTask.length
for (let i=0; i<fullTask.length; i++){

const userPrompt = original+fullTask[i];

response = await ai.models.generateContent({
model: aiModel,
contents: userPrompt,
});

original=response.text
console.log(response.text)
outputField.value = response.text;
bar.value =i+1+"/"+fullTask.length
}








}

  document.getElementById('submitBtn').addEventListener('click', run);
</script>
